name: Build Android (debug APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-disabled: false
      - name: Accept Android SDK licenses (preinstalled runner SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK and run unit tests
        run: gradle -p . --no-daemon testDebugUnitTest assembleDebug
      - name: Compute SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

  # Release build requires repository secrets (owner configures ALL FOUR):
  #   ANDROID_KEYSTORE_B64      base64 of the keystore file
  #   ANDROID_KEYSTORE_PASSWORD keystore password
  #   ANDROID_KEY_ALIAS         key alias
  #   ANDROID_KEY_PASSWORD      key password
  # Without them this job exits early and NO signed release is fabricated.
  # GitHub Actions does not support dynamic secret names, so each secret is
  # checked explicitly in separate steps (no loop interpolation).
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Check keystore secret
        id: secret_keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check keystore password
        id: secret_store_password
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check key alias
        id: secret_alias
        run: |
          if [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check key password
        id: secret_key_password
        run: |
          if [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Summarize secret availability
        id: has_secrets
        run: |
          missing=""
          [ "${{ steps.secret_keystore.outputs.ok }}" = "false" ] && missing="$missing ANDROID_KEYSTORE_B64"
          [ "${{ steps.secret_store_password.outputs.ok }}" = "false" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "${{ steps.secret_alias.outputs.ok }}" = "false" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ "${{ steps.secret_key_password.outputs.ok }}" = "false" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Signed release skipped (no fabrication)"
              echo "Missing secrets:$missing"
              echo "Configure all four in Settings → Secrets and variables → Actions, then re-tag."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Decode keystore
        if: steps.has_secrets.outputs.available == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/aster-release.keystore"
      - name: Build signed release APK and AAB
        if: steps.has_secrets.outputs.available == 'true'
        env:
          ASTER_ANDROID_KEYSTORE: ${{ runner.temp }}/aster-release.keystore
          ASTER_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASTER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASTER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p . --no-daemon assembleRelease bundleRelease
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: steps.has_secrets.outputs.available == 'true'
        with:
          name: android-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aster-release.keystore"
