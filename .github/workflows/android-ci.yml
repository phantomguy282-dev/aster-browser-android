name: Build Android (debug APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build debug APK and run unit tests
        run: |
          gradle -p . --no-daemon testDebugUnitTest assembleDebug
      - name: Compute SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

  # Release build requires secrets. Configure these repository secrets first:
  #   ANDROID_KEYSTORE_B64      base64 of the keystore file
  #   ANDROID_KEYSTORE_PASSWORD keystore password
  #   ANDROID_KEY_ALIAS         key alias
  #   ANDROID_KEY_PASSWORD      key password
  # Until they exist this job reports skipped, and NO signed release is fabricated.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - id: has_secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Decode keystore
        if: steps.has_secrets.outputs.available == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > $RUNNER_TEMP/aster-release.keystore
      - name: Build signed release APK and AAB
        if: steps.has_secrets.outputs.available == 'true'
        env:
          ASTER_ANDROID_KEYSTORE: ${{ runner.temp }}/aster-release.keystore
          ASTER_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASTER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASTER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p . --no-daemon assembleRelease bundleRelease
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: steps.has_secrets.outputs.available == 'true'
        with:
          name: android-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Cleanup keystore
        if: always()
        run: rm -f $RUNNER_TEMP/aster-release.keystore
