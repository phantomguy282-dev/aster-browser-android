name: Build Android (debug APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-disabled: false
      - name: Accept Android SDK licenses (preinstalled runner SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK and run unit tests
        run: gradle -p . --no-daemon testDebugUnitTest assembleDebug
      - name: Compute SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error

  # Release build requires repository secrets (owner configures):
  #   ANDROID_KEYSTORE_B64      base64 of the keystore file
  #   ANDROID_KEYSTORE_PASSWORD keystore password
  #   ANDROID_KEY_ALIAS         key alias
  #   ANDROID_KEY_PASSWORD      key password
  # Without them this job exits early and NO signed release is fabricated.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - id: has_secrets
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${{ secrets.$name }}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing incomplete — missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure all four in Settings → Secrets and variables → Actions. No signed release is fabricated without them." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Decode keystore
        if: steps.has_secrets.outputs.available == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/aster-release.keystore"
      - name: Build signed release APK and AAB
        if: steps.has_secrets.outputs.available == 'true'
        env:
          ASTER_ANDROID_KEYSTORE: ${{ runner.temp }}/aster-release.keystore
          ASTER_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASTER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASTER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p . --no-daemon assembleRelease bundleRelease
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: steps.has_secrets.outputs.available == 'true'
        with:
          name: android-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aster-release.keystore"
